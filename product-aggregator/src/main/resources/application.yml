otel:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp
  exporter:
    otlp:
      protocol: grpc
      endpoint: http://${OTEL_COLLECTOR_HOST}:4317

spring:
  threads:
    virtual:
      enabled: true
  grpc:
    client:
      channels:
        local:
          address: ${PRODUCT_REVIEW_HOST}:6565

  application:
    name: ${OTEL_SERVICE_NAME:OTEL_SERVICE_NAME_ENV_VARIABLE_MISSING}
  reactor:
    context-propagation: AUTO
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:JWT_ISSUER_URI_MISSING}


management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        histogram-flavor: explicit_bucket_histogram
        url: http://otel-collector:4317  # gRPC port (4317)
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics,trace,logfile
  metrics:
    enable:
      resilience4j.circuitbreaker: true

resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowType: COUNT_BASED
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 10
      waitDurationInOpenState: 5000ms
      failureRateThreshold: 50
      recordExceptions:
        - org.springframework.web.client.HttpServerErrorException
  instances:
    productDetailsClient:
      baseConfig: default
      slidingWindowSize: 20   # Overrides default (was 10)


app:
  egress:
    product-details-host: http://${PRODUCT_DETAILS_HOST:localhost}:8081
